<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2027"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9bff"/>
      <stop offset="1" stop-color="#4f6ef7"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- engineering grid -->
    <path d="M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512"
      stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>

    <!-- corner registration ticks -->
    <path d="M64 96v-32h32M416 64h32v32M448 416v32h-32M96 448H64v-32"
      stroke="#4f6ef7" stroke-opacity="0.8" stroke-width="10" fill="none"/>

    <!-- monogram M: left half off-white, right half signal blue -->
    <path d="M132 388V150l106 127" fill="none" stroke="#eef0f4"
      stroke-width="54" stroke-linecap="square"/>
    <path d="M256 298 380 150v238" fill="none" stroke="url(#signal)"
      stroke-width="54" stroke-linecap="square"/>
  </g>
</svg>
